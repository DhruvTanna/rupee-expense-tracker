function dashboard(){let x=monthNumbers(),balances=accountBalances(),exp=expMonth().filter(e=>matches(e)),spent=sum(exp),monthIncome=incomeMonth(),reimb=reimbMonth(),threshold=n(db.settings.threshold),usage=x.income+x.carry?spent/(x.income+x.carry):0;let catSum={};exp.forEach(e=>catSum[e.category]=(catSum[e.category]||0)+n(e.amount));let catTop=Object.entries(catSum).sort((a,b)=>b[1]-a[1])[0];let todayN=new Date().getDate(),avg=spent/Math.max(1,todayN),days=new Date(ACTIVE_YEAR,selectedMonth+1,0).getDate(),projected=x.income+x.carry+ x.reimb - avg*days;let prev=selectedMonth>0?sum(expMonth(selectedMonth-1)):0,delta=prev?((spent-prev)/prev*100):0;let daily={};exp.forEach(e=>daily[e.date]=(daily[e.date]||0)+n(e.amount));let maxD=Math.max(1,...Object.values(daily));let trend=`<svg viewBox="0 0 700 170"><line x1="25" y1="145" x2="690" y2="145" stroke="var(--line)"/>${Object.entries(daily).sort().map(([d,v],i)=>{let x=25+(Number(d.slice(-2))-1)*665/(days-1),y=145-v/maxD*110;return `<circle cx="${x}" cy="${y}" r="3" fill="#16805d"><title>${d}: ${money(v)}</title></circle>`}).join('')}${Object.entries(daily).sort().length>1?`<polyline fill="none" stroke="#16805d" stroke-width="2" points="${Object.entries(daily).sort().map(([d,v])=>`${25+(Number(d.slice(-2))-1)*665/(days-1)},${145-v/maxD*110}`).join(' ')}"/>`:''}</svg>`;let personal=sum(exp,e=>e.type!=='Split'),others=sum(exp,e=>e.type==='Split');let tagTotals={};exp.forEach(e=>(e.tags||[]).forEach(t=>tagTotals[t]=(tagTotals[t]||0)+n(e.amount)));let topTags=Object.entries(tagTotals).sort((a,b)=>b[1]-a[1]).slice(0,5);let biggest=[...exp].sort((a,b)=>b.amount-a.amount).slice(0,5);let topPeople=db.people.map(p=>({p,v:pendingPerson(p.id)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,5);let alerts=[];if(x.remaining<threshold)alerts.push(`Remaining balance is below your ${money(threshold)} warning threshold.`);if(usage>=1)alerts.push('You have used all of this month’s income and carry-forward.');else if(usage>=.8)alerts.push('You have used 80% of this month’s available income.');let unusual=Object.entries(catSum).find(([c,v])=>{let prior=MONTHS.slice(0,selectedMonth).map((_,i)=>sum(expMonth(i),e=>e.category===c));let avgprior=prior.length?prior.reduce((a,b)=>a+b,0)/prior.length:0;return avgprior>0&&v>avgprior*1.5});if(unusual)alerts.push(`${unusual[0]} spending is more than 50% above its average.`);let upcoming=upcomingItems();return `<div class="toolbar">${monthSelect()}<select id="fc"><option value="">All categories</option>${db.categories.map(c=>`<option ${filters.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="fp"><option value="">All people</option>${db.people.map(p=>`<option value="${p.id}" ${filters.person===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select id="fa"><option value="">All accounts</option>${db.accounts.map(a=>`<option value="${a.id}" ${filters.account===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select><input id="ft" placeholder="Filter tag" value="${esc(filters.tag)}"></div>${alerts.map(a=>`<div class="${a.includes('below')||a.includes('all of')?'dangerbox':'warning'}">${esc(a)}</div>`).join('')}<div class="grid cards"><div class="card"><div class="label">Balance left</div><div class="value ${x.remaining<threshold?'red':'green'}">${short(x.remaining)}</div><div class="sub">${selectedMonth>=0?MONTHS[selectedMonth]:''} remaining cash flow</div></div><div class="card"><div class="label">Spent this month</div><div class="value red">${short(spent)}</div><div class="sub">Gross expenses</div></div><div class="card"><div class="label">Total owed to me</div><div class="value amber">${short(receivable())}</div><div class="sub">${db.people.length} people</div></div><div class="card"><div class="label">Reimbursed this month</div><div class="value green">${short(sum(reimb))}</div><div class="sub">Actual net spend ${short(spent-sum(reimb))}</div></div><div class="card"><div class="label">Net worth</div><div class="value">${short(netWorth())}</div><div class="sub">All accounts + receivables − I owe</div></div></div><div class="grid twocol"><section class="panel"><div class="panelhead"><h2>Spending vs income · 2026</h2></div><div class="chart">${chartBars()}</div><div class="legend"><span><i class="dot" style="background:#35a875"></i>Income</span><span><i class="dot" style="background:#e56e64"></i>Expenses</span></div><div class="statsline" style="margin-top:12px"><span>Money received ${money(x.income)}</span><span>Carry forward ${money(x.carry)}</span><span>Received after payback ${money(x.ifpaid)}</span></div></section><section class="panel"><div class="panelhead"><h2>Spending by category</h2></div>${donut()}</section></div><div class="grid twocol"><section class="panel"><div class="panelhead"><h2>Daily spending trend</h2><span class="muted small">Average ${money(avg)}/day</span></div><div class="chart">${trend}</div></section><section class="panel"><div class="panelhead"><h2>Personal vs paid for others</h2></div><div class="kpi"><span>Personal <b>${short(personal)}</b></span><span>Paid for others <b>${short(others)}</b></span></div><div class="bartrack" style="margin:22px 0"><div class="barfill" style="width:${spent?personal/spent*100:0}%"></div></div><h2 style="margin:20px 0 12px">Spending by tag</h2>${topTags.length?topTags.map(t=>`<div class="rowtop"><span>${esc(t[0])}</span><b>${money(t[1])}</b></div>`).join(''):'<span class="muted small">No tagged expenses</span>'}</section></div><div class="grid twocol"><section class="panel"><div class="panelhead"><h2>Category budgets</h2><button class="btn" data-view="Budgets">Manage</button></div>${budgetContent()}</section><section class="panel"><div class="panelhead"><h2>Savings goals</h2><button class="btn" data-view="Goals">Manage</button></div>${goalContent()}</section></div><div class="grid twocol"><section class="panel"><div class="panelhead"><h2>Upcoming this month</h2><button class="btn" data-view="Recurring">Manage</button></div>${upcoming.length?upcoming.map(r=>`<div class="rowtop ${r.near?'warning':''}" style="padding:8px 0"><span>${esc(r.name)} <span class="muted small">· ${r.date.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</span></span><b>${money(r.amount)}</b></div>`).join(''):'<div class="empty">No upcoming recurring items</div>'}</section><section class="panel"><div class="panelhead"><h2>Insights</h2></div><div class="rowtop"><span>Highest category</span><b>${catTop?`${esc(catTop[0])} · ${money(catTop[1])}`:'—'}</b></div><div class="rowtop"><span>Projected month-end balance</span><b class="${projected<threshold?'red':'green'}">${short(projected)}</b></div><div class="rowtop"><span>Compared with last month</span><b class="${delta>0?'red':'green'}">${prev?`${delta>0?'+':''}${delta.toFixed(0)}% spent`:'No prior month data'}</b></div><div class="rowtop"><span>Remaining if everyone pays me</span><b class="green">${short(x.ifpaid)}</b></div></section></div><div class="grid twocol"><section class="panel"><div class="panelhead"><h2>Top 5 expenses</h2><button class="btn" data-view="Expenses">All expenses</button></div>${biggest.length?biggest.map(e=>`<div class="rowtop" style="padding:7px 0"><span>${esc(e.description||e.category)} <span class="muted small">${esc(e.date)}</span></span><b class="red">${money(e.amount)}</b></div>`).join(''):'<div class="empty">No expenses yet</div>'}</section><section class="panel"><div class="panelhead"><h2>People who owe the most</h2><button class="btn" data-view="People & Dues">View all</button></div>${topPeople.length?topPeople.map(x=>`<div class="rowtop" style="padding:7px 0"><span>${esc(x.p.name)}</span><b class="amber">${money(x.v)}</b></div>`).join(''):'<div class="empty">No pending dues</div>'}</section></div><section class="panel"><div class="panelhead"><h2>Recent transactions</h2><button class="btn" data-view="Expenses">See expenses</button></div>${expenseTable(exp.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6),false)}</section>`}
function matches(e){return(!filters.category||e.category===filters.category)&&(!filters.account||e.account===filters.account)&&(!filters.tag||(e.tags||[]).some(t=>t.toLowerCase().includes(filters.tag.toLowerCase())))&&(!filters.person||(e.shares||[]).some(s=>s.person===filters.person))&&(!filters.search||`${e.description} ${e.category} ${(e.tags||[]).join(' ')} ${e.note||''}`.toLowerCase().includes(filters.search.toLowerCase()))}
function expenseTable(items,withActions=true){if(!items.length)return'<div class="empty">Nothing here yet. Add your first transaction.</div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Account</th><th>Tags</th><th>Type</th><th>Amount</th>${withActions?'<th></th>':''}</tr></thead><tbody>${items.map(e=>`<tr><td>${esc(e.date)}</td><td><b>${esc(e.description||e.category)}</b>${e.note?`<div class="muted small">${esc(e.note)}</div>`:''}</td><td>${esc(e.category)}</td><td>${esc(accountName(e.account))}</td><td>${(e.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</td><td><span class="pill">${e.type==='Split'?'Paid for others / Split':'Personal'}</span></td><td class="amount red">${money(e.amount)}</td>${withActions?`<td><div class="actions"><button class="iconbtn" data-edit-exp="${e.id}" title="Edit">✎</button><button class="iconbtn" data-delete-exp="${e.id}" title="Delete">×</button></div></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function expensesPage(){return `${pageHead('Expenses','Track purchases, split costs, and keep every reimbursement linked.',`<button class="btn primary" id="addExpense">＋ Add expense</button>`)}<div class="toolbar"><input id="expenseSearch" class="search" placeholder="Search description, tag, note…" value="${esc(filters.search)}"><select id="expenseCat"><option value="">All categories</option>${db.categories.map(c=>`<option ${filters.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="expenseAccount"><option value="">All accounts</option>${db.accounts.map(a=>`<option value="${a.id}" ${filters.account===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select><select id="expensePerson"><option value="">All people</option>${db.people.map(p=>`<option value="${p.id}" ${filters.person===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><section class="panel"><div class="panelhead"><h2>${expMonth().filter(matches).length} expenses · ${money(sum(expMonth().filter(matches)))}</h2></div>${expenseTable(expMonth().filter(matches).sort((a,b)=>b.date.localeCompare(a.date)))}</section>${undoItem?`<div class="successbox">Expense deleted. <a class="mutedlink" id="undoDelete">Undo</a></div>`:''}`}
function incomePage(){let ins=incomeMonth().slice().sort((a,b)=>b.date.localeCompare(a.date));return `${pageHead('Income','Record salary, allowances, reimbursements and other money received.',`<button class="btn primary" id="addIncome">＋ Add income</button>`)}<div class="grid cards" style="grid-template-columns:repeat(3,1fr)"><div class="card"><div class="label">Received this month</div><div class="value green">${money(sum(ins))}</div></div><div class="card"><div class="label">Carry forward</div><div class="value">${money(db.settings.carry[monthKey()]?priorClosing(selectedMonth):0)}</div></div><div class="card"><label class="checkline"><input type="checkbox" id="carryToggle" ${db.settings.carry[monthKey()]?'checked':''}> Carry forward last month's remaining balance</label><div class="sub" style="margin-top:8px">${money(selectedMonth?monthNumbers(selectedMonth-1).remaining:0)} available from prior month</div></div></div><section class="panel"><div class="panelhead"><h2>Income entries</h2></div>${ins.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Source</th><th>Account</th><th>Amount</th><th></th></tr></thead><tbody>${ins.map(i=>`<tr><td>${esc(i.date)}</td><td>${esc(i.source)}</td><td>${esc(accountName(i.account))}</td><td class="amount green">${money(i.amount)}</td><td><button class="iconbtn" data-delete-income="${i.id}">×</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No income recorded for this month.</div>'}</section><section class="panel"><h2>Reimbursements received this month</h2><p class="muted small">Reimbursements increase account balances and reduce net spending; they are not counted as income.</p>${reimbTable(reimbMonth())}</section>`}
function reimbTable(rs){if(!rs.length)return'<div class="empty">No reimbursements recorded for this month.</div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>From</th><th>Expense</th><th>Account</th><th>Amount</th><th></th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(db.people.find(p=>p.id===r.person)?.name||'Unassigned')}</td><td>${esc(db.expenses.find(e=>e.id===r.expense)?.description||'General balance')}</td><td>${esc(accountName(r.account))}</td><td class="amount green">${money(r.amount)}</td><td><button class="iconbtn" data-delete-reimb="${r.id}">×</button></td></tr>`).join('')}</tbody></table></div>`}
function accountsPage(){let bals=accountBalances();return `${pageHead('Accounts','Live balances include opening balances, income, expenses, reimbursements and transfers.',`<button class="btn primary" id="addAccount">＋ Add account</button> <button class="btn" id="transferBtn">⇄ Transfer</button>`)}<div class="card" style="margin-bottom:16px"><div class="label">Total across accounts</div><div class="value">${money(Object.values(bals).reduce((a,b)=>a+b,0))}</div></div><div class="grid threecol">${db.accounts.map(a=>`<section class="panel"><div class="panelhead"><h2>${esc(a.name)}</h2><div><button class="iconbtn" title="Edit account" data-edit-account="${a.id}">✎</button> <button class="iconbtn" title="Delete account" data-delete-account="${a.id}">×</button></div></div><div class="value ${bals[a.id]<0?'red':'green'}">${money(bals[a.id])}</div><div class="muted small">${esc(a.type)} · Opening ${money(a.opening)}</div></section>`).join('')||'<section class="panel empty">Add an account to start tracking balances.</section>'}</div><section class="panel"><h2>Transfers</h2><p class="muted small">Transfers move money between accounts and never count as income or spending.</p>${db.transfers.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>From</th><th>To</th><th>Amount</th></tr></thead><tbody>${db.transfers.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(accountName(t.from))}</td><td>${esc(accountName(t.to))}</td><td class="amount">${money(t.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No transfers yet.</div>'}</section>`}
function peoplePage(){if(personView)return personDetail(personView);return `${pageHead('People & Dues','See who owes you, record repayments, and separately track money you owe.',`<button class="btn primary" id="addPerson">＋ Add person</button> <button class="btn" id="addReimb">＋ Record reimbursement</button>`)}<div class="grid twocol"><section class="panel"><div class="panelhead"><h2>Who owes me</h2><b class="amber">${money(receivable())}</b></div>${db.people.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Person</th><th>Pending</th><th>Status</th><th>Actions</th></tr></thead><tbody>${db.people.map(p=>`<tr><td><a class="mutedlink" data-person="${p.id}"><b>${esc(p.name)}</b></a></td><td class="amount amber">${money(pendingPerson(p.id))}</td><td><span class="pill ${pendingPerson(p.id)===0?'settled':'pending'}">${pendingPerson(p.id)===0?'Settled':db.expenses.some(e=>(e.shares||[]).some(sh=>sh.person===p.id)&&sum(db.reimbursements,r=>r.expense===e.id&&r.person===p.id)>0)?'Partially Paid':'Pending'}</span></td><td><button class="btn" data-person="${p.id}">Details</button> ${pendingPerson(p.id)>0?`<button class="btn primary" data-settle-person="${p.id}">Record payment</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No people yet. Add a person when someone owes you.</div>'}</section><section class="panel"><div class="panelhead"><h2>I Owe</h2><button class="btn" id="addIOU">＋ Add amount owed</button></div><p class="muted small">Loans, credit card dues and money owed to friends stay separate from expense reimbursements.</p>${db.iou.length?`<div class="tablewrap"><table class="table"><thead><tr><th>To</th><th>Reason</th><th>Amount left</th><th>Status</th><th>Actions</th></tr></thead><tbody>${db.iou.map(x=>`<tr><td>${esc(x.person)}</td><td>${esc(x.reason)}</td><td class="amount red">${money(Math.max(0,n(x.amount)-n(x.paid)))}</td><td><span class="pill ${n(x.amount)-n(x.paid)<=0?'settled':n(x.paid)>0?'pending':'pending'}">${n(x.amount)-n(x.paid)<=0?'Settled':n(x.paid)>0?'Partially Paid':'Pending'}</span></td><td>${n(x.amount)-n(x.paid)>0?`<button class="btn" data-pay-iou="${x.id}">Record payment</button> <button class="btn primary" data-settle-iou="${x.id}">Mark settled</button>`:'Paid in full'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nothing recorded here.</div>'}</section></div><section class="panel"><div class="panelhead"><h2>Recent reimbursements</h2><button class="btn" id="addReimb2">＋ Record</button></div>${reimbTable(db.reimbursements.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12))}</section>`}
function personDetail(pid){let p=db.people.find(x=>x.id===pid);if(!p){personView=null;return peoplePage()}let rows=db.expenses.filter(e=>(e.shares||[]).some(s=>s.person===pid)).map(e=>{let sh=e.shares.find(s=>s.person===pid),paid=sum(db.reimbursements,r=>r.expense===e.id&&r.person===pid);return{e,owed:n(sh.owed),paid,pending:Math.max(0,n(sh.owed)-paid)}});return `<div class="toolbar"><button class="btn" id="backPeople">← People</button></div>${pageHead(esc(p.name),'Expenses they shared, repayments received, and outstanding balance.',`<button class="btn primary" id="addReimb">＋ Record reimbursement</button>`)}<div class="grid cards" style="grid-template-columns:repeat(3,1fr)"><div class="card"><div class="label">Pending</div><div class="value amber">${money(pendingPerson(pid))}</div></div><div class="card"><div class="label">Total shared</div><div class="value">${money(rows.reduce((s,x)=>s+x.owed,0))}</div></div><div class="card"><div class="label">Repaid</div><div class="value green">${money(rows.reduce((s,x)=>s+x.paid,0))}</div></div></div><section class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Expense</th><th>Their share</th><th>Paid</th><th>Pending</th><th>Status</th></tr></thead><tbody>${rows.map(x=>{let due=x.e.shares.find(sh=>sh.person===pid)?.dueDate||x.e.date,old=x.pending>0&&due<today(),age=Math.floor((new Date(today())-new Date(due))/86400000);return `<tr><td>${esc(x.e.date)}${due?`<div class="muted small">Due ${esc(due)}</div>`:''}</td><td>${esc(x.e.description||x.e.category)}</td><td>${money(x.owed)}</td><td class="green">${money(x.paid)}</td><td class="${old&&x.pending?'red':'amber'}">${money(x.pending)} ${old&&x.pending?`<span class="pill overdue">${age} day${age===1?'':'s'} overdue</span>`:''}</td><td><span class="pill ${x.pending===0?'settled':'pending'}">${x.pending===0?'Settled':x.paid?'Partially Paid':'Pending'}</span></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No shared expenses.</td></tr>'}</tbody></table></div></section>`}
function budgetContent(){let ex=expMonth(),cats=[...new Set([...db.categories,...Object.keys(db.budgets)])];return cats.map(c=>{let spent=sum(ex,e=>e.category===c),limit=n(db.budgets[monthKey()]?.[c]),pct=limit?spent/limit*100:0;return `<div class="budgetrow"><div class="rowtop"><span><b>${esc(c)}</b></span><span class="small">${money(spent)} ${limit?`/ ${money(limit)}`:'· No limit'}</span></div>${limit?`<div class="bartrack"><div class="barfill" style="width:${Math.min(100,pct)}%;background:${pct>=100?'var(--red)':pct>=80?'#d49b26':'var(--green)'}"></div></div><div class="rowtop small ${pct>=100?'red':pct>=80?'amber':'muted'}"><span>${pct>=100?'Over budget':pct>=80?'Close to limit':'Remaining'}</span><span>${money(limit-spent)}</span></div>`:''}</div>`}).join('')||'<div class="empty">No categories configured.</div>'}function goalContent(){return db.goals.length?db.goals.map(g=>{let saved=sum(db.goalContrib,x=>x.goal===g.id),pct=g.target?saved/g.target*100:0,months=g.date?Math.max(1,(new Date(g.date)-new Date(today()))/(30.44*86400000)):0;return `<div class="goalrow"><div class="rowtop"><b>${esc(g.name)}</b><span>${money(saved)} / ${money(g.target)}</span></div><div class="bartrack"><div class="barfill" style="width:${Math.min(100,pct)}%"></div></div><div class="rowtop small muted"><span>${money(Math.max(0,g.target-saved))} to go</span><span>${months?`${money(Math.max(0,g.target-saved)/months)}/month to date`:''}</span></div></div>`}).join(''):'<div class="empty">No savings goals yet.</div>'}
function budgetsPage(){let cats=[...new Set([...db.categories,...Object.keys(db.budgets[monthKey()]||{})])];return `${pageHead('Budgets','Set a monthly category limit and keep an eye on how much is left.',`<button class="btn primary" id="addCategory">＋ Category</button>`)}<section class="panel"><div class="panelhead"><h2>${MONTHS[selectedMonth]} budgets</h2><button class="btn" id="setBudget">Set / edit limit</button></div>${budgetContent()}</section><section class="panel"><h2>Categories</h2><div style="margin-top:10px">${db.categories.map(c=>`<span class="tag">${esc(c)} <button class="iconbtn" style="font-size:12px" data-del-category="${escAttr(c)}">×</button></span>`).join('')}</div></section>`}
function goalsPage(){return `${pageHead('Savings Goals','Track planned savings separately from available day-to-day balance.',`<button class="btn primary" id="addGoal">＋ Create goal</button>`)}<div class="successbox">Goal contributions are tracked as allocations, not expenses. Account balances remain unchanged, while allocated money is shown separately.</div><div class="grid threecol">${db.goals.map(g=>{let saved=sum(db.goalContrib,x=>x.goal===g.id),left=Math.max(0,g.target-saved),months=g.date?Math.max(0,(new Date(g.date)-new Date(today()))/(30.44*86400000)):0;return `<section class="panel"><div class="panelhead"><h2>${esc(g.name)}</h2><button class="iconbtn" data-del-goal="${g.id}">×</button></div><div class="value">${money(saved)} <span class="muted small">of ${money(g.target)}</span></div><div class="bartrack" style="margin:12px 0"><div class="barfill" style="width:${Math.min(100,g.target?saved/g.target*100:0)}%"></div></div><div class="rowtop small muted"><span>${money(left)} remaining</span><span>${g.date?`Target ${esc(g.date)}`:'No target date'}</span></div>${months>0?`<p class="small">Save ${money(left/months)} per month to reach the target date.</p>`:''}<button class="btn" style="margin-top:8px" data-contribute="${g.id}">＋ Contribution</button><div class="muted small" style="margin-top:8px">Allocated: ${money(saved)}</div></section>`}).join('')||'<section class="panel empty">Create a savings goal to track progress.</section>'}</div><section class="panel"><h2>All contributions</h2>${db.goalContrib.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Goal</th><th>Amount</th><th>Note</th></tr></thead><tbody>${db.goalContrib.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(c=>`<tr><td>${esc(c.date)}</td><td>${esc(db.goals.find(g=>g.id===c.goal)?.name||'Removed goal')}</td><td class="green">${money(c.amount)}</td><td>${esc(c.note||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No contributions recorded.</div>'}</section>`}
function recurringPage(){let active=db.recurring.filter(r=>!r.paused);return `${pageHead('Recurring','Set monthly bills once. Each month a due item is added at most once when you visit the app.',`<button class="btn primary" id="addRecurring">＋ Add recurring item</button>`)}<div class="warning">Recurring items create an expense for this month when you open the tracker on or after the due day. Review the account and date if your bill changes.</div><section class="panel"><div class="panelhead"><h2>Upcoming this month</h2></div>${upcomingItems().map(r=>`<div class="rowtop ${r.near?'warning':''}" style="padding:9px 0"><span><b>${esc(r.name)}</b><span class="muted small"> · ${MONTHS[selectedMonth]} ${r.day} · ${esc(r.category)} · ${esc(accountName(r.account))}</span></span><b>${money(r.amount)} ${r.near?'<span class="pill pending">Due soon</span>':''}</b></div>`).join('')||'<div class="empty">No upcoming items.</div>'}</section><section class="panel"><div class="panelhead"><h2>Recurring rules</h2></div>${db.recurring.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Due</th><th>Category</th><th>Account</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${db.recurring.map(r=>`<tr><td>${esc(r.name)}</td><td>Day ${r.day}</td><td>${esc(r.category)}</td><td>${esc(accountName(r.account))}</td><td>${money(r.amount)}</td><td><span class="pill ${r.paused?'':'settled'}">${r.paused?'Paused':'Active'}</span></td><td><button class="btn" data-toggle-rec="${r.id}">${r.paused?'Resume':'Pause'}</button> <button class="iconbtn" data-edit-rec="${r.id}">✎</button> <button class="iconbtn" data-del-rec="${r.id}">×</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No recurring rules.</div>'}</section>`}
function upcomingItems(){let now=new Date(),arr=[];db.recurring.filter(r=>!r.paused).forEach(r=>{let due=new Date(ACTIVE_YEAR,selectedMonth,Math.min(r.day,new Date(ACTIVE_YEAR,selectedMonth+1,0).getDate())),run=db.recurringRuns.includes(`${r.id}:${monthKey()}`);if(!run&&due>=new Date(ACTIVE_YEAR,selectedMonth,1))arr.push({...r,date:due,near:(due-now)/(86400000)<=3&&(due-now)/(86400000)>=0})});return arr.sort((a,b)=>a.date-b.date)}
function yearPage(){let rows=MONTHS.map((m,i)=>{let x=monthNumbers(i),sav=sum(db.goalContrib,c=>monthOf(c.date)===monthKey(i));return `<tr><td><b>${m}</b></td><td class="green">${money(x.income)}</td><td class="red">${money(x.spent)}</td><td class="green">${money(x.reimb)}</td><td>${money(x.net)}</td><td>${money(sav)}</td><td class="${x.remaining<0?'red':'amount'}">${money(x.remaining)}</td></tr>`}).join('');return `${pageHead('Year Summary','A January to December ${ACTIVE_YEAR} view of money received, spending, savings and closing balance.')}<section class="panel"><div class="panelhead"><h2>Full year · ${ACTIVE_YEAR}</h2></div><div class="tablewrap"><table class="table"><thead><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Reimbursements</th><th>Net spending</th><th>Savings</th><th>Closing balance</th></tr></thead><tbody>${rows}<tr><td><b>Year total</b></td><td class="green amount">${money(sum(db.incomes,x=>x.date.startsWith(String(ACTIVE_YEAR))))}</td><td class="red amount">${money(sum(db.expenses,x=>x.date.startsWith(String(ACTIVE_YEAR))))}</td><td class="green amount">${money(sum(db.reimbursements,x=>x.date.startsWith(String(ACTIVE_YEAR))))}</td><td class="amount">${money(sum(db.expenses,x=>x.date.startsWith(String(ACTIVE_YEAR)))-sum(db.reimbursements,x=>x.date.startsWith(String(ACTIVE_YEAR))))}</td><td class="amount">${money(sum(db.goalContrib,x=>x.date.startsWith(String(ACTIVE_YEAR))))}</td><td class="amount">${money(monthNumbers(11).remaining)}</td></tr></tbody></table></div></section><section class="panel"><h2>Account closing balances</h2>${db.accounts.map(a=>`<div class="rowtop" style="padding:9px 0"><span>${esc(a.name)}</span><b>${money(accountBalances()[a.id])}</b></div>`).join('')}</section>`}
function settingsPage(){return `${pageHead('Settings','Manage local data, display preferences and casual-access lock.')}<section class="panel"><div class="panelhead"><h2>Cloud sync · Supabase</h2><span class="pill">${esc(cloudStatus)}</span></div><p class="muted small">Sign in on each device with the same email to sync. Data is stored in your private Supabase project. Keep JSON exports as backups.</p><div class="formgrid"><div class="field full"><label>Supabase project URL</label><input id="cloudUrl" type="url" placeholder="https://your-project.supabase.co" value="${esc(cloudConfig.url||'')}"></div><div class="field full"><label>Publishable key (safe for browser use with the included RLS policy)</label><input id="cloudKey" type="text" autocomplete="off" placeholder="sb_publishable_…" value="${esc(cloudConfig.key||'')}"></div></div><div class="toolbar" style="margin-top:10px"><button class="btn" id="saveCloudConfig">Save project connection</button></div>${cloudSession?`<div class="successbox">Signed in as ${esc(cloudSession.user.email)}. Sync saves after each change.</div><div class="toolbar"><button class="btn primary" id="syncCloudNow">Sync now</button><button class="btn" id="cloudLogout">Sign out on this device</button><button class="btn" id="changePassword">Change password</button><button class="btn danger" id="deleteMyAccount">Delete my account</button></div><p class="muted small">Deleting your account permanently removes your sign-in and tracker data.</p>`:`<div class="formgrid"><div class="field"><label>Email</label><input id="cloudEmail" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="cloudPassword" type="password" autocomplete="current-password"></div></div><div class="toolbar" style="margin-top:10px"><button class="btn primary" id="cloudSignIn">Sign in</button><button class="btn" id="cloudSignUp">Create account</button></div>`}<div class="muted small">Use only the publishable key here. Never paste a Supabase secret or service-role key into a browser app.</div></section><div class="grid twocol"><section class="panel"><h2>Preferences</h2><div class="field" style="margin-top:14px"><label>Low balance warning threshold</label><input id="threshold" type="number" min="0" step="0.01" value="${n(db.settings.threshold)}"></div><div class="field" style="margin-top:12px"><label>Appearance</label><button class="btn" id="themeBtn2">${db.settings.theme==='dark'?'Switch to light mode':'Switch to dark mode'}</button></div><div class="field" style="margin-top:12px"><label>Payment methods available</label><div>${db.paymentMethods.map(m=>`<span class="tag">${esc(m)} <button class="iconbtn" data-del-method="${escAttr(m)}">×</button></span>`).join('')}</div><div class="inline"><input id="newMethod" placeholder="Add payment method"><button class="btn" id="addMethod">Add</button></div></div></section><section class="panel"><h2>Email reminders</h2><p class="muted small">When a shared-expense due date passes and money is still owed, send one daily summary email to your signed-in address until it is paid. Set due dates on expense shares. Requires the reminder service to be configured in Supabase.</p><label class="checkline"><input id="emailReminders" type="checkbox" ${db.settings.emailReminders===true?'checked':''}> Email me about overdue amounts</label><p class="muted small">Reminders go only to your account email and include names, expense descriptions, due dates, and pending amounts. No email is sent for shares without a due date.</p></section><section class="panel"><h2>PIN lock</h2><p class="muted small">A PIN helps prevent casual access on this device. Your tracker data is stored in browser storage and this is not encryption or a secure account login.</p>${db.settings.pinHash?`<div class="successbox">PIN lock is enabled.</div><button class="btn" id="changePin">Change PIN</button> <button class="btn danger" id="removePin">Remove PIN</button>`:`<button class="btn primary" id="setPin">Set a PIN</button>`}</section></div><section class="panel"><h2>Backup and restore</h2><p class="muted small">Export JSON for a complete backup, or CSV for transaction rows. Import a JSON backup to restore your tracker.</p><button class="btn primary" id="exportBtn2">Export JSON</button> <button class="btn" id="csvBtn">Export CSV</button> <button class="btn" id="importBtn2">Import JSON</button><p class="muted small">Data remains in this browser unless you export it. Clearing browser data can remove it.</p></section><section class="panel"><h2>Categories</h2><p class="muted small">Categories can be managed from Budgets. Currency is Indian Rupees (₹); amounts use Indian digit grouping.</p></section>`}
function passwordRecoveryPage(){return `<div class="login"><div class="loginbox"><div class="brand"><span class="logo">₹</span> Rupee <span class="muted small">Personal Budget</span></div><h2>Choose a new password</h2><p class="muted small">Email verified for ${esc(cloudSession?.user?.email||'your account')}. Set a new password to finish recovery.</p><div class="field"><label>New password (8+ characters)</label><input id="recoveryPassword" type="password" autocomplete="new-password" minlength="8" required></div><div class="field" style="margin-top:10px"><label>Confirm new password</label><input id="recoveryConfirm" type="password" autocomplete="new-password" minlength="8" required></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" id="saveRecoveredPassword">Save new password</button><button class="btn" id="cancelRecovery">Cancel</button></div><p class="muted small">This reset link is for one-time password recovery.</p></div></div>`}function authGate(){return `<div class="login"><div class="loginbox"><div class="brand"><span class="logo">₹</span> Rupee <span class="muted small">Personal Budget</span></div><h2>Your private tracker</h2><p class="muted small">Sign in or create an account to open your tracker. Each account has its own private data, even when several people use this link.</p><div class="field"><label>Email</label><input id="cloudEmail" type="email" autocomplete="email" required></div><div class="field" style="margin-top:10px"><label>Password</label><input id="cloudPassword" type="password" autocomplete="current-password" required></div><div style="text-align:right;margin-top:-4px"><button class="iconbtn mutedlink small" type="button" id="forgotPassword">Forgot password?</button></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" id="cloudSignIn">Sign in</button><button class="btn" id="cloudSignUp">Create account</button></div><p class="muted small">Your tracker data is private to your signed-in account. Sign out on shared devices.</p><p class="muted small" id="cloudGateStatus">${esc(cloudStatus)}</p></div></div>`}function readStore(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch(e){return fallback}}
function storeSession(){if(cloudSession)localStorage.setItem(SESSION_KEY,JSON.stringify(cloudSession));else localStorage.removeItem(SESSION_KEY)}
function cloudBase(){return String(cloudConfig.url||'').trim().replace(/\/+$/,'')}
function cloudHeaders(auth=true){let h={'apikey':String(cloudConfig.key||'').trim(),'Content-Type':'application/json'};if(auth&&cloudSession?.access_token)h.Authorization='Bearer '+cloudSession.access_token;return h}
async function cloudRequest(path,options={}){if(!cloudBase()||!cloudConfig.key)throw Error('Save your Supabase project URL and publishable key first.');let response=await fetch(cloudBase()+path,{...options,headers:{...cloudHeaders(options.auth!==false),...(options.headers||{})}});let raw=await response.text(),payload;try{payload=raw?JSON.parse(raw):{}}catch{payload={message:raw}}if(!response.ok)throw Error(payload.msg||payload.message||payload.error_description||payload.error||`Cloud request failed (${response.status})`);return payload}
async function ensureCloudSession(){if(!cloudSession?.access_token)throw Error('Sign in first.');if(cloudSession.expires_at&&cloudSession.expires_at>Date.now()/1000+90)return;if(!cloudSession.refresh_token)throw Error('Session expired. Please sign in again.');let result=await cloudRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:JSON.stringify({refresh_token:cloudSession.refresh_token})});setCloudSession(result)}
function setCloudSession(x){cloudSession={...x,expires_at:x.expires_at||Math.floor(Date.now()/1000)+(x.expires_in||3600)};storeSession()}
function cloudDataPath(){return '/rest/v1/rupee_tracker_data'}
async function getCloudRow(){await ensureCloudSession();let rows=await cloudRequest(`${cloudDataPath()}?select=data,updated_at&user_id=eq.${encodeURIComponent(cloudSession.user.id)}`,{headers:{Accept:'application/json'}});return rows[0]||null}
async function putCloudData(){await ensureCloudSession();db.cloudOwnerId=cloudSession.user.id;await cloudRequest(`${cloudDataPath()}?on_conflict=user_id`,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:cloudSession.user.id,data:db,updated_at:new Date().toISOString()})});cloudSession.last_sync=Date.now();storeSession();cloudStatus='Synced just now'}

function hasPersonalData(x){return ['expenses','incomes','transfers','reimbursements','people','iou','iouPayments','goals','goalContrib','recurring'].some(k=>(x[k]||[]).length>0)||Object.keys(x.budgets||{}).length>0||(x.accounts||[]).some(a=>!['Cash','Main Bank'].includes(a.name)||n(a.opening)!==0)}
function mergeSnapshots(local,remote){let out={...remote,...local,settings:{...(remote.settings||{}),...(local.settings||{})}};for(let k of ['accounts','expenses','incomes','transfers','reimbursements','people','iou','iouPayments','goals','goalContrib','recurring']){let m=new Map((remote[k]||[]).map(x=>[x.id,x]));(local[k]||[]).forEach(x=>m.set(x.id,x));out[k]=[...m.values()]}out.categories=[...new Set([...(remote.categories||[]),...(local.categories||[])])];out.paymentMethods=[...new Set([...(remote.paymentMethods||[]),...(local.paymentMethods||[])])];out.budgets={...(remote.budgets||{}),...(local.budgets||{})};out.settings.carry={...(remote.settings?.carry||{}),...(local.settings?.carry||{})};out.recurringRuns=[...new Set([...(remote.recurringRuns||[]),...(local.recurringRuns||[])])];return out}

function passwordModal(){modal('Change account password',`<div class="formgrid"><div class="field full"><label>Current password</label><input name="current" type="password" autocomplete="current-password" required></div><div class="field"><label>New password (8+ characters)</label><input name="next" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label>Confirm new password</label><input name="confirm" type="password" autocomplete="new-password" minlength="8" required></div></div>`,async d=>{if(d.next!==d.confirm)return notify('The new passwords do not match.');if(d.next.length<8)return notify('Use at least 8 characters for the new password.');try{await ensureCloudSession();await cloudRequest('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:JSON.stringify({email:cloudSession.user.email,password:d.current})});await cloudRequest('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:d.next})});notify('Password changed successfully.')}catch(e){notify(e.message||'Could not change the password.')}})}
function deleteOwnAccountModal(){modal('Delete your account permanently',`<p class="dangerbox">This permanently deletes your sign-in and all tracker data saved to this account. This cannot be undone.</p><div class="field"><label>Current password</label><input name="current" type="password" autocomplete="current-password" required></div><div class="field" style="margin-top:10px"><label>Type DELETE to confirm</label><input name="confirm" autocomplete="off" required></div>`,async d=>{if(d.confirm!=='DELETE')return notify('Type DELETE exactly to confirm.');clearTimeout(saveTimer);saveTimer=null;if(!confirm('Permanently delete the signed-in account '+(cloudSession.user.email||'')+' and its tracker data?'))return;try{await ensureCloudSession();let verified=await cloudRequest('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:JSON.stringify({email:cloudSession.user.email,password:d.current})});await cloudRequest('/functions/v1/delete-account',{method:'POST',headers:{Authorization:'Bearer '+verified.access_token},body:JSON.stringify({})});let uid=cloudSession.user.id;localStorage.removeItem(KEY+':user:'+uid);if(localStorage.getItem(OWNER_KEY)===uid)localStorage.removeItem(OWNER_KEY);localStorage.removeItem(KEY);cloudSession=null;storeSession();db=defaults();cloudStatus='Account deleted';render();notify('Account and tracker data deleted.')}catch(e){notify(e.message||'Could not delete the account.')}})}
async function requestPasswordReset(){let email=document.getElementById('cloudEmail')?.value.trim();if(!email)return notify('Enter your email address first.');try{let redirectTo=window.location.origin+window.location.pathname+window.location.search;await cloudRequest(`/auth/v1/recover?redirect_to=${encodeURIComponent(redirectTo)}`,{method:'POST',auth:false,body:JSON.stringify({email})});cloudStatus='If an account exists, a reset link has been sent. Check your inbox and spam folder.';render();notify('Check your email for the password reset link.')}catch(e){cloudStatus='Could not send a reset link';render();notify(e.message||'Could not send the reset email.')}}
async function completePasswordRecovery(){let next=document.getElementById('recoveryPassword')?.value||'',confirmPassword=document.getElementById('recoveryConfirm')?.value||'';if(next.length<8)return notify('Use at least 8 characters for the new password.');if(next!==confirmPassword)return notify('The new passwords do not match.');try{await cloudRequest('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:next})});passwordRecoveryPending=false;await cloudInitialSync();notify('Password reset successfully.')}catch(e){notify(e.message||'Could not reset the password.')}}
function bindRecovery(){let save=document.getElementById('saveRecoveredPassword');if(save)save.onclick=completePasswordRecovery;let cancel=document.getElementById('cancelRecovery');if(cancel)cancel.onclick=()=>{passwordRecoveryPending=false;cloudLogout()}}
async function cloudLogin(signup=false){let email=document.getElementById('cloudEmail')?.value.trim(),password=document.getElementById('cloudPassword')?.value;if(!email||!password)return notify('Enter your email and password.');try{cloudStatus=signup?'Creating account…':'Signing in…';render();let redirectTo=window.location.origin+window.location.pathname+window.location.search;let endpoint=signup?`/auth/v1/signup?redirect_to=${encodeURIComponent(redirectTo)}`:'/auth/v1/token?grant_type=password';let result=await cloudRequest(endpoint,{method:'POST',auth:false,body:JSON.stringify({email,password})});if(!result.access_token){cloudStatus='Check your email to confirm the account, then sign in.';render();notify('Check your email to confirm signup');return}setCloudSession(result);await cloudInitialSync();notify('Cloud sync is ready')}catch(e){cloudStatus='Could not connect';notify(e.message)}render()}
async function handleAuthCallback(){let fragment=new URLSearchParams(window.location.hash.slice(1)),accessToken=fragment.get('access_token');if(!accessToken)return;let refreshToken=fragment.get('refresh_token'),authType=fragment.get('type'),error=fragment.get('error_description')||fragment.get('error');history.replaceState(null,'',window.location.pathname+window.location.search);if(error){cloudStatus='Email confirmation failed';render();notify(error.replace(/\+/g,' '));return}if(!refreshToken){cloudStatus='Email confirmed · please sign in';render();notify('Email confirmed. Sign in with your email and password.');return}try{cloudStatus='Finishing email confirmation…';render();let response=await fetch(cloudBase()+'/auth/v1/user',{headers:{apikey:String(cloudConfig.key||'').trim(),Authorization:'Bearer '+accessToken}});let user=await response.json();if(!response.ok)throw Error(user.msg||user.message||'Could not validate the confirmation link.');setCloudSession({access_token:accessToken,refresh_token:refreshToken,token_type:fragment.get('token_type')||'bearer',expires_in:Number(fragment.get('expires_in'))||3600,expires_at:Number(fragment.get('expires_at'))||0,user});if(authType==='recovery'){passwordRecoveryPending=true;render();notify('Email verified. Choose a new password.');return}await cloudInitialSync();notify('Email confirmed · cloud sync is ready')}catch(e){cloudStatus='Could not finish email confirmation';render();notify(e.message)}}async function cloudInitialSync(){let uid=cloudSession.user.id,userKey=KEY+':user:'+uid,old=db;db=defaults();syncBusy=true;render();try{let row=await getCloudRow();if(row?.data){let remote=row.data;if(remote.cloudOwnerId===uid){db={...defaults(),...remote}}else{download('rupee-tracker-legacy-backup.json','application/json',JSON.stringify(remote,null,2));let clean=confirm('A backup of this Gmail’s older tracker was downloaded. This saved data predates privacy checks and may include another sign-in. Press OK to start this Gmail with a b.accounts=db.accounts.filter(x=>x.id!==aid);save();notify(refs?'Account removed; opening balance and linked records moved.':'Account removed; opening balance moved.')}function accountModal(aid){let a=db.accounts.find(x=>x.id===aid)||{};modal(aid?'Edit account':'Add account',`<div class="formgrid">${inp('Account name','name','text',a.name||'','required')}${sel('Type','type',['Cash','Bank','UPI','Debit Card','Credit Card','Net Banking','Other'].map(x=>[x,x]),a.type||'Bank')}${inp('Opening balance (₹)','opening','number',a.opening??0,'step=".01"')}</div>`,d=>{if(aid){a.name=d.name;a.type=d.type;a.opening=n(d.opening)}else db.accounts.push({id:id(),name:d.name,type:d.type,opening:n(d.opening)});save()})}function transferModal(){if(db.accounts.length<2)return notify('Create at least two accounts first');modal('Transfer between accounts',`<div class="formgrid">${inp('Date','date','date',entryDate(),`min="${ACTIVE_YEAR}-01-01" max="${ACTIVE_YEAR}-12-31" required`)}${amountField()}${sel('From account','from',opts(db.accounts))}${sel('To account','to',opts(db.accounts))}</div>`,d=>{if(d.from===d.to)return notify('Choose two different accounts');db.transfers.push({id:id(),date:d.date,amount:n(d.amount),from:d.from,to:d.to});save()})}function personModal(){modal('Add person',`${inp('Name','name','text','','required')}`,d=>{if(db.people.some(p=>p.name.toLowerCase()===d.name.trim().toLowerCase()))return notify('That person already exists');db.people.push({id:id(),name:d.name.trim()});save()})}
function reimbModal(pid,settle=false){let person=pid?db.people.find(p=>p.id===pid):null;let due=pid?pendingPerson(pid):0;modal(settle?'Settle outstanding amount':'Record reimbursement',`<div class="formgrid">${inp('Date','date','date',entryDate(),`min="${ACTIVE_YEAR}-01-01" max="${ACTIVE_YEAR}-12-31" required`)}${amountField(settle?due:undefined)}${sel('Person','person',opts(db.people),person?.id||'')}${accountField(db.accounts[0]?.id||'')}<div class="field full"><label>Link to expense (optional)</label><select name="expense"><option value="">Person's overall balance</option>${db.expenses.filter(e=>(e.shares||[]).some(s=>!person||s.person===person.id)).map(e=>`<option value="${e.id}">${esc(e.date)} · ${esc(e.description||e.category)} · ${money(e.amount)}</option>`).join('')}</select></div></div><div class="warning">Any excess over a person's pending amount is kept as an unallocated credit and does not create negative dues.</div>`,d=>{if(!d.person)return notify('Choose a person');let ex=d.expense||'';let existing=ex?sum(db.reimbursements,r=>r.expense===ex&&r.person===d.person):0;let owed=ex?(db.expenses.find(e=>e.id===ex)?.shares||[]).filter(s=>s.person===d.person).reduce((s,x)=>s+n(x.owed),0):pendingPerson(d.person);let usable=Math.min(n(d.amount),Math.max(0,owed-existing));if(usable>0)db.reimbursements.push({id:id(),date:d.date,amount:usable,person:d.person,account:d.account,expense:ex});let extra=n(d.amount)-usable;if(extra>0)db.reimbursements.push({id:id(),date:d.date,amount:extra,person:d.person,account:d.account,expense:'',credit:true});save();notify(extra?'Reimbursement saved; excess kept as credit':'Reimbursement saved')})}
function iouSettle(iid){iouPay(iid,true)}function iouModal(){modal('Add amount I owe',`<div class="formgrid">${inp('Person / lender','person','text','','required')}${amountField()}${inp('Reason','reason','text','','required')}</div>`,d=>{db.iou.push({id:id(),person:d.person,amount:n(d.amount),paid:0,reason:d.reason});save()})}function iouPay(iid,settle=false){let x=db.iou.find(a=>a.id===iid);if(!x)return;let left=Math.max(0,n(x.amount)-n(x.paid));if(left<=0)return notify('This due is already settled');modal(settle?'Settle amount owed':'Record payment',`<div class="formgrid">${inp('Date','date','date',entryDate(),`min="${ACTIVE_YEAR}-01-01" max="${ACTIVE_YEAR}-12-31" required`)}${amountField(settle?left:undefined)}${accountField(db.accounts[0]?.id||'')}</div><p class="muted small">Payment will be deducted from the selected account balance.</p>`,d=>{let amount=n(d.amount);if(amount<=0)return notify('Enter a positive amount');let paid=Math.min(amount,left);if(!db.iouPayments)db.iouPayments=[];db.iouPayments.push({id:id(),date:d.date,amount:paid,account:d.account,iou:iid});x.paid=n(x.paid)+paid;save();notify(n(x.amount)-n(x.paid)<=0?'Marked as settled':'Payment recorded')})}function categoryModal(){modal('Add category',`${inp('Category name','name','text','','required')}`,d=>{if(!db.categories.includes(d.name.trim()))db.categories.push(d.name.trim());save()})}function budgetModal(){modal(`Set ${MONTHS[selectedMonth]} budget`,`${sel('Category','category',db.categories.map(c=>[c,c]))}${inp('Monthly limit (₹)','amount','number',db.budgets[monthKey()]?.[db.categories[0]]||'','min="0" step=".01" required')}`,d=>{db.budgets[monthKey()]??={};db.budgets[monthKey()][d.category]=n(d.amount);save()})}function goalModal(){modal('Create savings goal',`<div class="formgrid">${inp('Goal name','name','text','','required')}${amountField()}${inp('Optional target date','date','date','','')}</div>`,d=>{db.goals.push({id:id(),name:d.name,target:n(d.amount),date:d.date});save()})}function contributionModal(gid){let g=db.goals.find(x=>x.id===gid);modal(`Contribute to ${esc(g.name)}`,`<div class="formgrid">${inp('Date','date','date',entryDate(),`min="${ACTIVE_YEAR}-01-01" max="${ACTIVE_YEAR}-12-31" required`)}${amountField()}${inp('Note','note','text')}</div>`,d=>{db.goalContrib.push({id:id(),goal:gid,date:d.date,amount:n(d.amount),note:d.note});save()})}
function recurringModal(rid){let r=db.recurring.find(x=>x.id===rid)||{};modal(rid?'Edit recurring item':'Add recurring item',`<div class="formgrid">${inp('Name','name','text',r.name||'','required')}${amountField(r.amount)}${sel('Category','category',db.categories.map(c=>[c,c]),r.category||db.categories[0])}${accountField(r.account||db.accounts[0]?.id||'')}${inp('Day of month','day','number',r.day||1,'min="1" max="31" required')}</div>`,d=>{if(rid)Object.assign(r,{name:d.name,amount:n(d.amount),category:d.category,account:d.account,day:Math.min(31,Math.max(1,n(d.day)))});else db.recurring.push({id:id(),name:d.name,amount:n(d.amount),category:d.category,account:d.account,day:Math.min(31,Math.max(1,n(d.day))),paused:false});save()})}
function deleteExpense(eid){let e=db.expenses.find(x=>x.id===eid);if(!e)return;let linked=db.reimbursements.filter(r=>r.expense===eid);if(linked.length){let msg=`This expense has ${linked.length} linked reimbursement(s). Delete it and remove those links? Account balances will decrease by the reimbursements removed.`;if(!confirm(msg))return;db.reimbursements=db.reimbursements.filter(r=>r.expense!==eid)}undoItem={expense:e,reimbursements:linked};db.expenses=db.expenses.filter(x=>x.id!==eid);save();notify('Deleted. Use Undo to restore expense')}
async function hash(v){let data=new TextEncoder().encode(v);let buf=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('')}function pinModal(change){modal(change?'Change PIN':'Set PIN',`<div class="field"><label>${change?'Current PIN':''}</label><input name="old" type="password" inputmode="numeric"></div><div class="field"><label>New PIN (4–12 digits)</label><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" required></div>`,async d=>{if(change&&await hash(d.old)!==db.settings.pinHash)return notify('Current PIN is incorrect');db.settings.pinHash=await hash(d.pin);sessionStorage.removeItem('rupee-unlocked');save();notify('PIN updated')})}
function download(name,type,data){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportJSON(){download('rupee-budget-2026-backup.json','application/json',JSON.stringify(db,null,2));notify('JSON backup downloaded')}function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}function exportCSV(){let rows=[['kind','date','description','category','amount_INR','account','tags','note','type','person','owed_share']];db.expenses.forEach(e=>rows.push(['expense',e.date,e.description,e.category,e.amount,accountName(e.account),(e.tags||[]).join('|'),e.note,e.type,'',''],...(e.shares||[]).map(s=>['share',e.date,e.description,e.category,e.amount,accountName(e.account),(e.tags||[]).join('|'),e.note,e.type,db.people.find(p=>p.id===s.person)?.name||'',s.owed])));db.incomes.forEach(i=>rows.push(['income',i.date,i.source,'',i.amount,accountName(i.account)]));db.reimbursements.forEach(r=>rows.push(['reimbursement',r.date,'', '',r.amount,accountName(r.account),'','','',db.people.find(p=>p.id===r.person)?.name||'']));db.transfers.forEach(t=>rows.push(['transfer',t.date,`${accountName(t.from)} → ${accountName(t.to)}`,'',t.amount]));download('rupee-budget-2026.csv','text/csv;charset=utf-8',rows.map(r=>r.map(csvCell).join(',')).join('\r\n'));notify('CSV downloaded')}function importJSON(){let f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=()=>{let file=f.files[0];if(!file)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!x||!Array.isArray(x.accounts)||!Array.isArray(x.expenses)||x.version!==1)throw Error('This is not a Rupee tracker backup');if(confirm('Replace the current tracker data with this backup?')){db={...defaults(),...x};save();notify('Backup restored')}}catch(e){alert('Could not import: '+e.message)}};rd.readAsText(file)};f.click()}
function recurringRun(){let now=new Date();if(now.getFullYear()!==ACTIVE_YEAR)return;let key=monthKey(now.getMonth());let changed=false;db.recurring.filter(r=>!r.paused&&now.getDate()>=r.day).forEach(r=>{let mark=`${r.id}:${key}`;if(!db.recurringRuns.includes(mark)){let day=Math.min(r.day,new Date(ACTIVE_YEAR,now.getMonth()+1,0).getDate());db.expenses.push({id:id(),date:`${ACTIVE_YEAR}-${String(now.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,amount:n(r.amount),category:r.category,description:r.name,account:r.account,tags:['Recurring'],note:'Created from recurring rule',type:'Personal',shares:[],recurringId:r.id});db.recurringRuns.push(mark);changed=true}});if(changed)localStorage.setItem(KEY,JSON.stringify(db))}
recurringRun();render();if(cloudSession&&!window.location.hash.includes("access_token"))cloudInitialSync().catch(()=>{});handleAuthCallback();setInterval(cloudPoll,20000);
})();
